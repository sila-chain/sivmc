[bumpversion]
current_version = 12.1.0
tag = True
sign_tags = True
tag_message = SIVMC {new_version}
commit = True
message = SIVMC {new_version}
	
	Bump version: {current_version} → {new_version}
parse = (?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)(-(?P<prerel>rc|alpha)\.(?P<prerelver>\d+))?
serialize = 
	{major}.{minor}.{patch}-{prerel}.{prerelver}
	{major}.{minor}.{patch}

[bumpversion:part:prerel]
optional_value = rel
values = 
	alpha
	rc
	rel

[bumpversion:file:CMakeLists.txt]

[bumpversion:file:go.mod]
serialize = {major}
search = github.com/sila-chain/sivmc/v{current_version}
replace = github.com/sila-chain/sivmc/v{new_version}

[bumpversion:file:test/gomod/use_sivmc_test.go]
serialize = {major}
search = github.com/sila-chain/sivmc/v{current_version}
replace = github.com/sila-chain/sivmc/v{new_version}

[bumpversion:file:test/gomod/README]
serialize = {major}
search = github.com/sila-chain/sivmc/v{current_version}
replace = github.com/sila-chain/sivmc/v{new_version}

[bumpversion:file:bindings/rust/sivmc-sys/Cargo.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file:bindings/rust/sivmc-vm/Cargo.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file:bindings/rust/sivmc-declare/Cargo.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file:bindings/rust/sivmc-declare-tests/Cargo.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file:examples/example-rust-vm/Cargo.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file:examples/example-rust-vm/src/lib.rs]
search = "{current_version}"
replace = "{new_version}"
